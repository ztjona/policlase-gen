[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policlase-gen"
version = "0.1.0"
description = "Esquema, validador y CLI de autoría de preguntas de policlase"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["ruamel.yaml>=0.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
policlase = "policlase_gen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/policlase_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
